[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-for-pandas"
version = "0.1.0"
description = "Retrieval-augmented answers over the pandas API documentation, with a retriever fine-tuned and evaluated on Stack Overflow questions."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Exact, tested versions are pinned in requirements.txt.
dependencies = [
    "accelerate",
    "datasets",
    "fastapi",
    "httpx",
    "numpy",
    "pydantic",
    "rank-bm25",
    "sentence-transformers",
    "torch",
    "transformers",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is on the path so tests can check the summaries that scripts print.
pythonpath = ["src", "scripts"]
