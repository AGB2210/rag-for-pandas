[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "docsearch"
version = "0.1.0"
description = "Search over pandas API documentation, evaluated on real Stack Overflow questions."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Exact, tested versions are pinned in requirements.txt.
dependencies = [
    "accelerate",
    "datasets",
    "fastapi",
    "httpx",
    "numpy",
    "rank-bm25",
    "sentence-transformers",
    "torch",
    "transformers",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
