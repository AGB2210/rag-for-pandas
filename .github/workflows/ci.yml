# Runs the tests that need no trained models, data or GPU: Python unit and API
# tests (the API tests use fake models) and the web page's component tests and
# build. Browser tests need the trained retriever, so they run locally with
# `npm run e2e` (see README).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # The CPU build first: tests use no GPU, and it is a much smaller download
      # than the CUDA build. requirements.txt then finds torch==2.11.0 installed.
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm test

      - name: Type-check and build
        run: npm run build
